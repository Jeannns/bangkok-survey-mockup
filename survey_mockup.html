<style>
:root{
  color-scheme: light;
  --blue:#2563eb; --blue-dark:#1e40af; --bg:#f4f6fb; --card:#ffffff;
  --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --green:#16a34a; --amber:#d97706;
  --purple:#7c3aed; --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:920px;margin:0 auto;padding:24px 20px 80px}
.tabs{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:999px;box-shadow:var(--shadow);width:fit-content;margin:0 auto 24px}
.tab{padding:10px 22px;border-radius:999px;border:none;background:transparent;font-weight:600;font-size:14px;color:var(--sub);cursor:pointer;transition:.15s}
.tab.active{background:var(--blue);color:#fff}
.lang-tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--shadow);width:fit-content;margin:0 auto 18px}
.lang-tab{padding:6px 16px;border-radius:999px;border:none;background:transparent;font-weight:700;font-size:12.5px;color:var(--sub);cursor:pointer;transition:.15s}
.lang-tab.active{background:var(--purple);color:#fff}
.view{display:none}
.view.active{display:block}

/* ---- shared card/header ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;margin-bottom:16px}
.hero{text-align:center;padding:36px 20px}
.hero h1{font-size:26px;margin:0 0 8px}
.hero p{color:var(--sub);font-size:15px;line-height:1.6;max-width:520px;margin:0 auto}
.pill{display:inline-block;background:#eef2ff;color:var(--blue-dark);font-size:12px;font-weight:700;letter-spacing:.03em;padding:4px 12px;border-radius:999px;margin-bottom:14px}

/* ---- RP wizard ---- */
.progress-wrap{margin-bottom:22px}
.progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:99px;transition:width .3s}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.section-tag{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.step-title{font-size:20px;font-weight:700;margin:0 0 4px}
.step-sub{color:var(--sub);font-size:13px;margin:0 0 22px}
.field{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-label{font-weight:600;font-size:15px;margin-bottom:4px;line-height:1.5}
.q-help{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.q-note{font-size:11.5px;color:var(--amber);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 10px;margin-top:8px;display:inline-block}
.locpicker{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.loc-search{border:none;border-bottom:1px solid var(--line);border-radius:0;background:#fff}
.loc-map{height:150px;position:relative;cursor:crosshair;background-color:#eef2f7;background-image:linear-gradient(#dbe3ee 1px,transparent 1px),linear-gradient(90deg,#dbe3ee 1px,transparent 1px);background-size:22px 22px}
.loc-pin{position:absolute;width:16px;height:16px;background:#ef4444;border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg) translate(-50%,-100%);box-shadow:0 1px 4px rgba(0,0,0,.3);display:none}
.loc-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;pointer-events:none;text-align:center;padding:0 20px}
.loc-map-real{border-top:1px solid var(--line);background:#eef2f7}
.map-zoom-ctrl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.map-zoom-ctrl button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);line-height:1}
.loc-hint-real{font-size:11px;color:var(--sub);padding:6px 12px;background:#f8fafc;border-top:1px solid var(--line)}
.loc-latlng{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.loc-latlng input{width:120px}
.btn-confirm-pin{border:none;background:var(--blue);color:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.loc-status{font-size:11.5px;color:var(--sub)}
.loc-status.ok{color:var(--green);font-weight:700}
.loc-fields{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.loc-fields input{border:none;border-radius:0;background:#fff}
.loc-fields input:first-child{border-right:1px solid var(--line)}

input[type=text],input[type=number],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa
}
textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;cursor:pointer;background:#fff;transition:.15s;user-select:none}
.opt.checked{border-color:var(--blue);background:#eef2ff;color:var(--blue-dark);font-weight:600}
.opt input{display:none}

.likert-table{width:100%;border-collapse:collapse;font-size:13px}
.likert-table td{padding:8px 4px;text-align:center}
.likert-table .lbl{text-align:left;padding-right:10px;font-size:13.5px;line-height:1.4;width:46%}
.likert-scale{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);background:#fff}
.likert-scale.checked{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.likert-head{font-size:10.5px;color:var(--sub)}

/* house picker */
.house-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.house-card{border:2px solid var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.15s;color:var(--sub)}
.house-card:hover{border-color:#c7d2fe}
.house-card.selected{border-color:var(--blue);background:#eef2ff;color:var(--blue-dark)}
.house-card svg{width:64px;height:64px;margin-bottom:8px}
.house-card .h-label{font-weight:700;font-size:14px}

/* avatars / character creation */
.avatar-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:20px 0;min-height:110px;align-items:flex-end}
.avatar{cursor:pointer;text-align:center;transition:.15s}
.avatar:hover{transform:translateY(-3px)}
.avatar svg{display:block;margin:0 auto}
.avatar .status-dot{width:9px;height:9px;border-radius:50%;background:#d1d5db;display:inline-block;margin-right:4px}
.avatar.done .status-dot{background:var(--green)}
.avatar-name{font-size:12px;font-weight:600;margin-top:4px;color:var(--ink)}
.avatar-role{font-size:10.5px;color:var(--sub)}
.empty-hint{color:var(--sub);font-size:13px;text-align:center;padding:20px}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{position:sticky;top:0;background:#fff;padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-head h3{margin:0;font-size:17px}
.modal-close{border:none;background:#f3f4f6;width:30px;height:30px;border-radius:50%;font-weight:700;cursor:pointer;color:var(--sub)}
.modal-body{padding:20px 24px}

.chip-select{display:flex;flex-wrap:wrap;gap:8px}
.chip-select .chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;background:#fff}
.chip-select .chip.active{border-color:var(--blue);background:#eef2ff;color:var(--blue-dark)}
.chip-select .chip .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db}
.chip-select .chip.active .dot{background:var(--blue)}

.member-chip{display:inline-flex;align-items:center;gap:6px;background:#f3f4f6;border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.add-btn{border:1.5px dashed var(--line);border-radius:10px;padding:9px 16px;background:transparent;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer}
.stop-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.stop-item{display:flex;align-items:center;gap:10px;background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stop-item .idx{width:22px;height:22px;border-radius:50%;background:var(--blue-dark);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.remove{margin-left:auto;color:#ef4444;cursor:pointer;font-size:12px;font-weight:700}
.drag-handle{margin-left:8px;color:var(--sub);font-size:11px;cursor:grab;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff;user-select:none}
.edit-stop{margin-left:8px;color:var(--blue-dark);font-size:11px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:#fff;font-weight:700;user-select:none}
.stop-item.drag-over{outline:2px dashed var(--blue)}
.confirm-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;color:#166534}
.prompt-box{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.prompt-box h4{margin:0 0 14px;font-size:16px}
.segment-card{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.segment-title{font-size:12.5px;font-weight:700;color:var(--blue-dark);margin-bottom:10px}
.escort-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;margin-top:10px}
.escort-box .tag{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;margin-bottom:8px;display:block}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{padding:12px 26px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--sub)}
.btn-ghost:hover{color:var(--ink)}

/* ---- SP game ---- */
.sp-progress{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.sp-progress .dot{width:30px;height:6px;border-radius:99px;background:var(--line)}
.sp-progress .dot.active{background:var(--purple)}
.sp-progress .dot.done{background:#c4b5fd}
.sp-round-label{text-align:center;color:var(--sub);font-size:13px;font-weight:600;margin-bottom:4px}
.sp-question{text-align:center;font-size:19px;font-weight:700;margin:0 0 26px}
.option-row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);position:relative}
.opt-card:hover{border-color:#c7d2fe;transform:translateY(-2px)}
.opt-card.selected{border-color:var(--purple);background:#faf5ff}
.opt-card .icon{font-size:26px;line-height:1;margin-bottom:8px}
.opt-card .scene-illust{width:100%;height:auto;border-radius:12px;margin-bottom:10px;display:block}
.opt-card .opt-title{font-weight:700;font-size:15.5px;margin-bottom:12px}
.attr-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;color:var(--ink)}
.attr-row .ic{width:20px;text-align:center;flex-shrink:0;font-size:14px}
.attr-row b{margin-left:auto;font-weight:700}
.danger-bar{display:flex;gap:2px;margin-left:auto}
.danger-bar span{width:6px;height:12px;border-radius:2px;background:var(--line)}
.danger-bar span.on{background:#ef4444}
.pick-badge{position:absolute;top:-10px;right:14px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:none}
.opt-card.selected .pick-badge{display:block}
.sp-footer{text-align:center;margin-top:26px;color:var(--sub);font-size:12.5px}
.debrief-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.summary-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:16px;margin-top:18px;font-size:13.5px}
</style>

<div class="app">
  <div class="lang-tabs">
    <button class="lang-tab active" id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-tab" id="lang-th" onclick="setLang('th')">&#3652;&#3607;&#3618;</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="rp">RP Survey</button>
    <button class="tab" data-tab="sp">SP Survey (interactive)</button>
  </div>

  <!-- ================= RP VIEW ================= -->
  <div class="view active" id="view-rp">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="rp-fill"></div></div>
      <div class="progress-label"><span id="rp-step-name">Welcome</span><span id="rp-step-count">0 / 14</span></div>
    </div>
    <div class="card" id="rp-card"></div>
  </div>

  <!-- ================= SP VIEW ================= -->
  <div class="view" id="view-sp">
    <div class="card" id="sp-card"></div>
  </div>

  <!-- ================= CHARACTER MODAL ================= -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title">Character</h3><button class="modal-close" onclick="closeModal()">X</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
</div>

const A = {};
function val(id,d){return A[id]!==undefined?A[id]:d;}

function likert(container,name,items,scaleLabels){
  let rows = items.map((it,i)=>{
    let cells = [1,2,3,4,5].map(s=>{
      const key = name+'_'+i;
      const checked = val(key)==s ? 'checked':'';
      return `<td><span class="likert-scale ${checked}" onclick="setLikert('${key}',${s},this)">${s}</span></td>`;
    }).join('');
    return `<tr><td class="lbl">${t(it)}</td>${cells}</tr>`;
  }).join('');
  return `<table class="likert-table"><tr><td></td><td class="likert-head" colspan="5" style="text-align:center">${t(scaleLabels||'1 = low, 5 = high')}</td></tr>${rows}</table>`;
}
window.setLikert = (key,val_,el)=>{
  A[key]=val_;
  el.parentElement.parentElement.querySelectorAll('.likert-scale').forEach(s=>s.classList.remove('checked'));
  el.classList.add('checked');
  const step = rpSteps[rpIdx];
  if(step && step.customNav) renderRP();
};

function opts(name,options,multi){
  return `<div class="opt-row">` + options.map(o=>{
    const checked = multi ? (val(name+'_'+o,false)?'checked':'') : (val(name)===o?'checked':'');
    return `<label class="opt ${checked}" onclick="pickOpt(this,'${name}','${o}',${!!multi})">${t(o)}</label>`;
  }).join('') + `</div>`;
}
window.pickOpt = (el,name,o,multi)=>{
  if(multi){ const k=name+'_'+o; A[k]=!A[k]; el.classList.toggle('checked'); }
  else { A[name]=o; el.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('checked')); el.classList.add('checked'); renderRP(); }
};

function selectOpts(name,options){
  const cur = val(name) || '';
  return `<select onchange="A['${name}']=this.value;renderRP()">
    <option value="" ${cur===''?'selected':''}>${t('Select a line')}</option>
    ${options.map(o=>`<option value="${o.replace(/"/g,'&quot;')}" ${cur===o?'selected':''}>${t(o)}</option>`).join('')}
  </select>`;
}

function mapSrc(id){
  const z = A[id+'_zoom'] || 17;
  if(A[id+'_confirmed'] && A[id+'_lat'] && A[id+'_lng']){
    return 'https://www.google.com/maps?q='+encodeURIComponent(A[id+'_lat']+','+A[id+'_lng'])+'&z='+z+'&output=embed';
  }
  const q = encodeURIComponent(A[id+'_search'] || A[id+'_name'] || 'Bangkok, Thailand');
  return 'https://www.google.com/maps?q='+q+'&z='+z+'&output=embed';
}
window.zoomMap = (id,delta)=>{
  const z = Math.min(20, Math.max(3, (A[id+'_zoom']||17)+delta));
  A[id+'_zoom'] = z;
  const ifr = document.getElementById('map_'+id);
  if(ifr) ifr.src = mapSrc(id);
};
function locPicker(id){
  const confirmed = A[id+'_confirmed'];
  const coordStr = A[id+'_lat'] ? (A[id+'_lat']+', '+A[id+'_lng']) : '';
  return `<div class="locpicker">
    <input class="loc-search" type="text" placeholder="${t('Search for a place or address, then press Enter')}" value="${A[id+'_search']||''}" oninput="A['${id}_search']=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();updateMap('${id}')}">
    <div class="loc-map-real" style="position:relative">
      <iframe id="map_${id}" width="100%" height="180" style="border:0;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${mapSrc(id)}"></iframe>
      <div class="map-zoom-ctrl">
        <button type="button" onclick="zoomMap('${id}',1)">+</button>
        <button type="button" onclick="zoomMap('${id}',-1)">-</button>
      </div>
    </div>
    <div class="loc-hint-real">${t('Real Google Map - search above to move the map, use the +/- buttons to zoom, or paste coordinates below and press Confirm to drop a pin at an exact spot. On Google Maps, right-click (or long-press) a spot and choose "What\'s here?" to get its coordinates.')}</div>
    <div class="loc-fields">
      <input type="text" placeholder="${t('Place name (e.g. Home, Office Building B)')}" value="${A[id+'_name']||''}" oninput="A['${id}_name']=this.value">
      <input type="text" placeholder="${t('Address / nearest landmark')}" value="${A[id+'_addr']||''}" oninput="A['${id}_addr']=this.value">
    </div>
    <div class="loc-latlng">
      <input type="text" id="coords_${id}" placeholder="${t('Paste coordinates, e.g. 13.9668, 100.6843')}" value="${coordStr}" style="flex:1;width:auto">
      <button type="button" class="btn-confirm-pin" onclick="confirmPin('${id}')">${t('Confirm location')}</button>
      <span id="locstatus_${id}" class="loc-status ${confirmed?'ok':''}">${confirmed?t('Location confirmed (pin set)'):t('Not confirmed yet')}</span>
    </div>
  </div>`;
}
window.confirmPin = (id)=>{
  const el = document.getElementById('coords_'+id);
  const raw = el ? el.value.trim() : '';
  const parts = raw.split(',').map(s=>s.trim()).filter(Boolean);
  const ok = parts.length===2 && !isNaN(parseFloat(parts[0])) && !isNaN(parseFloat(parts[1]));
  A[id+'_lat'] = ok?parts[0]:''; A[id+'_lng'] = ok?parts[1]:'';
  A[id+'_confirmed'] = ok;
  const st = document.getElementById('locstatus_'+id);
  if(st){
    st.textContent = ok ? t('Location confirmed (pin set)') : t('Could not read two numbers - paste as "lat, lng"');
    st.classList.toggle('ok', ok);
  }
  const ifr = document.getElementById('map_'+id);
  if(ifr && ok) ifr.src = mapSrc(id);
};
window.updateMap = (id)=>{
  const q = encodeURIComponent(A[id+'_search']||'Bangkok, Thailand');
  const ifr = document.getElementById('map_'+id);
  if(ifr) ifr.src = 'https://www.google.com/maps?q='+q+'&output=embed';
};

let nAdultsTarget = 2, nChildrenTarget = 1;
let activeCharId = null;

function cval(ch,key,d){ return A[ch.id+'_'+key]!==undefined ? A[ch.id+'_'+key] : d; }
function isCharDone(ch){
  const p = ch.id;
  const base = !!A[p+'_name'] && A[p+'_age']!==undefined && !!A[p+'_gender'] && !!A[p+'_religion'] && !!A[p+'_edu'];
  if(!base) return false;
  if(ch.kind==='adult'){
    return !!A[p+'_employ'] && (A[p+'_lic_car']||A[p+'_lic_moto']||A[p+'_lic_none']);
  }
  return !!A[p+'_schooltype'] && !!A[p+'_usesbus'];
}
function childName(ch){ return A[ch.id+'_name'] || t('Child'); }
function adultName(ch){ return A[ch.id+'_name'] || t('Adult'); }
function kidDecisionDone(ch){
  const p = ch.id;
  if(!!val('escorted_'+p,false)){
    for(let i=0;i<7;i++){ if(val('escort_reason_'+p+'_'+i)===undefined) return false; }
    return true;
  }
  for(let i=0;i<3;i++){ if(val('not_escort_reason_'+p+'_'+i)===undefined) return false; }
  return val('main_reason_'+p)!==undefined;
}

function createCharacters(){
  characters = [];
  charSeq = 0;
  for(let i=0;i<nAdultsTarget;i++){ charSeq++; characters.push({id:'ch'+charSeq, kind:'adult'}); }
  for(let i=0;i<nChildrenTarget;i++){ charSeq++; characters.push({id:'ch'+charSeq, kind:'child'}); }
  routeChildIdx = 0; facilityChildIdx = 0; tuitionChildIdx = 0; decisionChildIdx = 0;
  renderRP();
}

function avatarSVG(ch){
  const done = isCharDone(ch);
  const color = done ? '#2563eb' : '#9ca3af';
  const isChild = ch.kind==='child';
  const scale = isChild ? 0.75 : 1;
  const w = 46*scale, h = 70*scale;
  return `<svg width="${w}" height="${h}" viewBox="0 0 46 70">
    <circle cx="23" cy="14" r="12" fill="${color}"/>
    <rect x="8" y="28" width="30" height="38" rx="10" fill="${color}"/>
  </svg>`;
}

function renderAvatarRow(){
  if(characters.length===0) return `<div class="empty-hint">${t('Set the counts above, then press "Create household members" to generate everyone as characters.')}</div>`;
  return `<div class="avatar-row">${characters.map(ch=>{
    const done = isCharDone(ch);
    const name = A[ch.id+'_name'] || (ch.kind==='adult'?t('Adult'):t('Child'));
    const role = A[ch.id+'_role'] || t('Tap to set up');
    return `<div class="avatar ${done?'done':''}" onclick="openModal('${ch.id}')">
      ${avatarSVG(ch)}
      <div class="avatar-name"><span class="status-dot"></span>${name}</div>
      <div class="avatar-role">${role}</div>
    </div>`;
  }).join('')}</div>`;
}

function openModal(id){
  activeCharId = id;
  document.getElementById('modal-overlay').classList.add('open');
  renderModal();
}
window.closeModal = ()=>{ activeCharId=null; document.getElementById('modal-overlay').classList.remove('open'); renderAvatarSectionOnly(); };

  if(!ch) return;
  const p = ch.id;
  document.getElementById('modal-title').textContent = (A[p+'_name']||(t('New')+' '+(ch.kind==='adult'?t('Adult'):t('Child')))) + t(' - Individual Information');
  const eduField = ch.kind==='adult'
    ? `<div class="field"><div class="q-label">${t('Highest education level')}</div>${opts(p+'_edu',['Junior high or lower','Senior high or equivalent','Undergraduate degree','Graduate degree','Postgraduate degree'])}</div>`
    : `<div class="field"><div class="q-label">${t('Current education level')}</div>${opts(p+'_edu',['Not attending any school','Pre-school','Elementary school','Junior high or equivalent','Senior high or equivalent','Undergraduate degree'])}</div>
       <div class="field"><div class="q-label">${t('If school-going: specific grade')}</div>${opts(p+'_grade',['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'])}</div>`;
  const employField = ch.kind==='adult'
    ? `<div class="field"><div class="q-label">${t('Employment status')}</div>${opts(p+'_employ',['Full-time','Part-time','Self-employed','Retired','Not employed (incl. students)'])}</div>
       <div class="field"><div class="q-label">${t('Occupation')}</div><input type="text" value="${A[p+'_occupation']||''}" oninput="A['${p}_occupation']=this.value" placeholder="${t('e.g. Teacher, Engineer, Vendor')}"></div>
       <div class="field"><div class="q-label">${t('Work start / end time (if employed)')}</div><div class="grid2"><input type="time"><input type="time"></div></div>
       <div class="field"><div class="q-label">${t('Primary workplace location')}</div>${locPicker(p+'_work')}</div>
       <div class="field"><div class="q-label">${t('Does this person hold a Rabbit Card or MRT Card?')}</div>${opts(p+'_transit_card',['Yes','No'])}</div>`
    : `<div class="field"><div class="q-label">${t('School start / end time (if school-going)')}</div><div class="grid2"><input type="time"><input type="time"></div></div>
       <div class="field"><div class="q-label">${t('School name and location')}</div>${locPicker(p+'_school')}</div>
       <div class="field"><div class="q-label">${t('School type')}</div>${opts(p+'_schooltype',['Public','Private, local','Private, international'])}</div>
       <div class="field"><div class="q-label">${t('Does this child use school bus service?')}</div>${opts(p+'_usesbus',['Yes','No'])}</div>
       <div class="q-note">${t('Collected once here - Sections 4 and 5 will reuse this instead of asking again.')}</div>`;

  document.getElementById('modal-body').innerHTML = `
    <div class="field"><div class="q-label">${t('Nickname / initial')}</div><input type="text" value="${A[p+'_name']||''}" oninput="A['${p}_name']=this.value;renderAvatarSectionOnly();document.getElementById('modal-title').textContent=this.value+'${t(' - Individual Information').replace(/'/g,"\\'")}'" placeholder="${t('e.g. Somchai, Child A')}"></div>
    <div class="field"><div class="q-label">${t('Role in household')}</div>${opts(p+'_role',['Father','Mother','Child','Grandfather','Grandmother','Non-relative (e.g. helper)'])}</div>
    <div class="field"><div class="q-label">${t('Age (years)')}</div><input type="number" value="${A[p+'_age']!==undefined?A[p+'_age']:''}" oninput="A['${p}_age']=this.value;renderAvatarSectionOnly()" placeholder="${t('e.g. 34')}" style="width:140px"></div>
    <div class="field"><div class="q-label">${t('Gender')}</div>${opts(p+'_gender',['Male','Female','Other'])}</div>
    <div class="field"><div class="q-label">${t('Religion')}</div>${opts(p+'_religion',['Buddhist','Muslim','Christian','Other','None','Prefer not to say'])}</div>
    ${eduField}
    ${employField}
    <div class="field"><div class="q-label">${t('Driving license')}</div>
      <div class="opt-row">
      <label class="opt ${cval(ch,'lic_car',false)?'checked':''}" onclick="A['${p}_lic_car']=!A['${p}_lic_car'];if(A['${p}_lic_car'])A['${p}_lic_none']=false;renderModal()">${t('Car')}</label>
      <label class="opt ${cval(ch,'lic_moto',false)?'checked':''}" onclick="A['${p}_lic_moto']=!A['${p}_lic_moto'];if(A['${p}_lic_moto'])A['${p}_lic_none']=false;renderModal()">${t('Motorbike')}</label>
      <label class="opt ${cval(ch,'lic_none',false)?'checked':''}" onclick="A['${p}_lic_none']=!A['${p}_lic_none'];if(A['${p}_lic_none']){A['${p}_lic_car']=false;A['${p}_lic_moto']=false;}renderModal()">${t('None')}</label>
      </div></div>
    <div class="nav-row"><span></span><button class="btn btn-primary" onclick="closeModal()">${t('Save & close')}</button></div>
  `;
}

  const el = document.getElementById('avatar-row-slot');
  if(el) el.innerHTML = renderAvatarRow();

function childTabRow(kids,activeIdx,onClickFn){
  if(kids.length===0) return '';
  return `<div class="chip-select" style="margin-bottom:16px">${kids.map((c,i)=>{

function isStepComplete(step){
  switch(step.name){
    case 'Household - House & Location': return val('residence_type')!==undefined && !!A['home_confirmed'];
    case 'Household - Vehicles & Income': return val('n_cars')!==undefined && val('n_bikes')!==undefined && val('income')!==undefined;
    case 'Household - Create Your Household': return characters.length>0 && characters.every(isCharDone);
    case 'Morning routine activities': return maintActivities.every((m,i)=>A['maint_'+i+'_min']!==undefined && A['maint_'+i+'_pref']!==undefined);
    case 'Travel Diary - Register a Trip':
    case 'Travel Diary - Trip Details':
      return Object.keys(tripsByPerson).length>0;
    case 'Escorting - Habit': return val('q1')!==undefined;
    case 'Escorting - Decision (why)': { const kids=characters.filter(c=>c.kind==='child'); return kids.length===0 || kids.every(kidDecisionDone); }
    case 'Escorting - Threat & Coping (PMT)': return val('allow_independent')!==undefined;
    case 'Escorting - Travel Mode': return val('escort_mode')!==undefined;
    case 'Escorting - Route & Air Quality': { const kids=characters.filter(c=>c.kind==='child'); return kids.length===0 || kids.every(c=>val(c.id+'_major_road')!==undefined); }
    case 'Escorting - School Facilities': { const kids=characters.filter(c=>c.kind==='child'); return kids.length===0 || kids.every(c=>val(c.id+'_school_facility')!==undefined); }
    case 'School Choice': { const kids=characters.filter(c=>c.kind==='child'); const tuitionOk = kids.length===0 || kids.every(c=>val('tuition_'+c.id)!==undefined); return val('route_relation')!==undefined && tuitionOk; }
    default: return true;
  }
}

let tripConfirmed = false;
let segIdx = 0;
let showTripDonePrompt = false;
let dragSrcIdx = null;
window.dragStart = (i)=>{ dragSrcIdx = i; };
window.dropStop = (i)=>{
  if(dragSrcIdx===null || dragSrcIdx===i) return;
  const item = stops.splice(dragSrcIdx,1)[0];
  stops.splice(i,0,item);
  dragSrcIdx = null;
  tripConfirmed = false;
  renderRP();
};
function resetTripState(){
  tripPerson = null; stops = [newStop('Home'), newStop('School'), newStop('Home')];
  tripConfirmed = false; segIdx = 0; showTripDonePrompt = false;
}
function stopLocLabel(s){
  if(!s.loc) return '';
  if(s.loc.type==='home') return t('Home (registered)');
  if(s.loc.type==='registered'){
    const c = characters.find(c=>c.id===s.loc.personId);
    const nm = c ? (A[c.id+'_name']||(c.kind==='adult'?t('Adult'):t('Child'))) : '';
    return nm + (s.loc.kind==='work' ? t(' - workplace (registered)') : t(' - school (registered)'));
  }
  if(s.loc.type==='custom') return A[s.id+'_name'] || A[s.id+'_addr'] || t('Custom location set');
  return '';
}
window.showStopLocList = (stopId)=>{
  const s = stops.find(x=>x.id===stopId);
  if(!s) return;
  document.getElementById('modal-title').textContent = t('Set location for')+' "'+(s.place||'?')+'"';
  const adults = characters.filter(c=>c.kind==='adult');
  const kids = characters.filter(c=>c.kind==='child');
  const rows = [];
  rows.push(`<div class="stop-item" style="cursor:pointer" onclick="pickStopLoc('${stopId}','home')"><span style="flex:1">${t('Home')}</span><span class="drag-handle">${t('Use this')}</span></div>`);
  adults.forEach(c=>{
    const nm = A[c.id+'_name']||t('Adult');
    rows.push(`<div class="stop-item" style="cursor:pointer" onclick="pickStopLoc('${stopId}','work','${c.id}')"><span style="flex:1">${nm} ${t("- workplace")}</span><span class="drag-handle">${t('Use this')}</span></div>`);
  });
  kids.forEach(c=>{
    const nm = A[c.id+'_name']||t('Child');
    rows.push(`<div class="stop-item" style="cursor:pointer" onclick="pickStopLoc('${stopId}','school','${c.id}')"><span style="flex:1">${nm} ${t("- school")}</span><span class="drag-handle">${t('Use this')}</span></div>`);
  });
  document.getElementById('modal-body').innerHTML = `
    <div class="q-note">${t('Choose a registered place, or enter a new one below.')}</div>
    <div class="stop-list">${rows.join('')}</div>
    <div class="nav-row"><span></span><button class="btn btn-ghost" style="border:1px solid var(--line)" onclick="stopLocCustom('${stopId}')">${t('Not in this list - enter manually')}</button></div>
  `;
};
window.openStopLocationPicker = (stopId)=>{
  const s = stops.find(x=>x.id===stopId);
  if(!s) return;
  document.getElementById('modal-overlay').classList.add('open');
  if(s.loc && s.loc.type==='custom'){ stopLocCustom(stopId); }
  else { showStopLocList(stopId); }
};
window.pickStopLoc = (stopId,type,personId)=>{
  const s = stops.find(x=>x.id===stopId);
  if(!s) return;
  s.loc = personId ? {type:'registered',kind:type,personId} : {type:'home'};
  document.getElementById('modal-overlay').classList.remove('open');
  renderRP();
};
window.stopLocCustom = (stopId)=>{
  document.getElementById('modal-title').textContent = t('Enter location');
  document.getElementById('modal-body').innerHTML = `
    ${locPicker(stopId)}
    <div class="nav-row">
      <button class="btn btn-ghost" style="border:1px solid var(--line)" onclick="showStopLocList('${stopId}')">${t('Choose a registered place instead')}</button>

};
window.confirmStopLocCustom = (stopId)=>{
  const s = stops.find(x=>x.id===stopId);

{name:'Travel Diary - Trip Details', tag:'Section 3 - Trip Details (per segment)', customNav:true, render:()=>{
  if(!tripPerson) return `<div class="empty-hint">${t('Go back and register a trip first.')}</div>
    <div class="nav-row"><button class="btn btn-ghost" onclick="rpIdx--;renderRP()">${t('<- Back')}</button>${tempSaveBtn()}${devMode?`<button class="btn btn-primary" onclick="rpIdx++;renderRP()">${t('Next ->')}</button>`:'<span></span>'}</div>`;

  if(tripsByPerson[tripPerson]==='NO_TRIP' && !showTripDonePrompt){
    return `<div class="empty-hint">${t('This person made no trips that day - nothing to detail. Continue to see if anyone else needs a trip registered.')}</div>
      <div class="nav-row"><button class="btn btn-ghost" onclick="rpIdx--;renderRP()">${t('<- Back')}</button>${tempSaveBtn()}<button class="btn btn-primary" onclick="showTripDonePrompt=true;renderRP()">${t('Next ->')}</button></div>`;
  }

  const totalSegs = Math.max(0, stops.length-1);

  if(showTripDonePrompt || totalSegs===0){
    return `<div class="prompt-box"><h4>${dl('Does anyone else in the household have a trip on [date] too?')}</h4>
      <div class="nav-row" style="justify-content:center;gap:14px">
        <button class="btn btn-primary" onclick="resetTripState();rpIdx=rpSteps.findIndex(s=>s.name==='Travel Diary - Register a Trip');renderRP()">${t('Yes, register their trip')}</button>
        <button class="btn btn-ghost" style="border:1px solid var(--line)" onclick="showTripDonePrompt=false;rpIdx++;renderRP()">${t('No, continue')}</button>
      </div></div>`;
  }

  const i = segIdx;
  const ns = tripPerson+'_'+i;
  const purposeKey='purpose_'+ns;
  const isEscort = (val(purposeKey)||'').indexOf('Escorting')>=0 || (val(purposeKey)||'').indexOf('School escort')>=0;
  const segMode = val('mode_'+ns);
  const isRailMode = segMode==='MRT' || segMode==='BTS Skytrain';
  const isCarMode = segMode==='Private car' || segMode==='Private motorbike';
  const seg = `<div class="q-help">${t('Segment')} ${i+1} ${t('of')} ${totalSegs}</div>
    <div class="segment-card"><div class="segment-title">${stops[i].place||'?'} -&gt; ${stops[i+1].place||'?'}</div>
    <div class="grid2">
      <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Departure time')}</div><input type="time"></div>
      <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Arrival time')}</div><input type="time"></div>
    </div>
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Who traveled with you on this segment?')}</div>
      <div class="opt-row">${characters.filter(c=>c.id!==tripPerson).map(c=>{
        const nm = A[c.id+'_name']||(c.kind==='adult'?t('Adult'):t('Child'));
        const key = 'seg_'+ns+'_companion_'+c.id;
        const on = val(key,false)?'checked':'';
        return `<label class="opt ${on}" onclick="A['${key}']=!A['${key}'];this.classList.toggle('checked')">${nm}</label>`;
      }).join('') || `<span class="q-help">${t('No other household members yet.')}</span>`}</div></div>
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Travel mode (main mode for this segment)')}</div>
      ${opts('mode_'+ns,['Walk','Bike','School bus','Private car','Private motorbike','Ride-hailing - car','Ride-hailing - motorbike','Regular taxi','MRT','BTS Skytrain','Bus'])}</div>
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Did you use more than one way of getting there? If yes, list them in order')}</div>
      ${opts('multimode_'+ns,['No, one mode only','Yes'])}<input type="text" placeholder="${t('e.g. walk, then bus, then train')}" style="margin-top:8px"></div>
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('For each mode change above, about how long did the walk (or wait) between arriving from one mode and boarding the next take?')}</div><input type="number" placeholder="${t('minutes')}" style="width:140px"></div>
    ${isRailMode?`
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('If BTS or MRT: which line?')}</div>
      ${selectOpts('line_'+ns,['Red Line (Bang Sue - Rangsit/Thammasat)','Red Line (Bang Sue - Taling Chan)','Airport Rail Link (Phaya Thai - Makkasan - Suvarnabhumi)','Green Line - Sukhumvit (Khu Khot - Kehha)','Green Line - Silom (National Stadium - Bang Wa)','Blue Line (Tha Phra - Bang Sue - Hua Lamphong - Lak Song)','Purple Line (Tao Poon - Khlong Bang Phai)','Pink Line (Khae Rai - Pak Kret - Min Buri)','Yellow Line (Lat Phrao - Phatthanakan - Samrong)'])}</div>
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('If BTS or MRT: boarding station / alighting station')}</div>
      <div class="grid2"><input type="text" placeholder="${t('Boarding station')}"><input type="text" placeholder="${t('Alighting station')}"></div></div>`:''}
    ${isCarMode?`
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('If by car or motorbike: were you the driver or a passenger?')}</div>
      ${opts('driverpax_'+ns,['Driver','Passenger'])}</div>`:''}
    <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Main purpose of this trip')}</div>
      ${opts(purposeKey,['Commuting to work','School escort','Going to school (for children)','Return home','Return to workplace','Escorting (other)','Shopping','Leisure','Medical-related','Other private purpose','Business/work-related'])}</div>
    ${isEscort?`
    <div class="escort-box"><span class="tag">${t('Escort trip - extra detail')}</span>
      <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Taking the child TO school, or bringing them FROM school?')}</div>
        ${opts('escdir_'+ns,['To school','From school'])}</div>
      <div class="field" style="border:none;padding:0;margin-bottom:10px"><div class="q-label" style="font-size:13px">${t('Drop-off / pick-up point')}</div>${locPicker('dropoff_'+ns)}</div>
      <div class="field" style="border:none;padding:0"><div class="q-label" style="font-size:13px">${t('After arriving, how long do you usually wait?')}</div><input type="number" placeholder="${t('minutes')}" style="width:140px"></div>
    </div>`:''}
    <div class="field" style="border:none;padding:0;margin-top:10px"><div class="q-label" style="font-size:13px">${t('Fare/cost (THB, 0 if free)')}</div><input type="number" style="width:120px"></div>
    </div>`;

  const backAction = i>0 ? `segIdx=${i-1};renderRP()` : `rpIdx--;renderRP()`;
  const nextAction = i<totalSegs-1 ? `segIdx=${i+1};renderRP()` : `showTripDonePrompt=true;renderRP()`;
  const nextLabel = i<totalSegs-1 ? t('Next segment ->') : t('Finish trip ->');
  return `${seg}<div class="nav-row">
    <button class="btn btn-ghost" onclick="${backAction}">${t('<- Back')}</button>
    ${tempSaveBtn()}
    <button class="btn btn-primary" onclick="${nextAction}">${nextLabel}</button>
  </div>`;
}},

{name:'Escorting - Decision (why)', tag:'Section 4 - School Escorting Decision', customNav:true, render:()=>{
  const kids = characters.filter(c=>c.kind==='child');
  let perChildBlock;
  if(kids.length===0){
    perChildBlock = `<div class="empty-hint">${t('No child characters created yet.')}</div>`;
  } else {
    const idx = Math.min(decisionChildIdx, kids.length-1);

    perChildBlock = `${childTabRow(kids, idx, 'setDecisionChild')}
      <div class="q-note">${childName(ch)} ${t('is currently marked as')} ${escorted?t('escorted'):t('not escorted')} ${t('(set in the Habit step above)')}</div>
      ${escorted ? `
      <div class="field"><div class="q-label">${t('What makes you decide to escort')} ${childName(ch)}?</div>
        ${likert(null,'escort_reason_'+p,['Concern about stranger harassment/kidnapping','Concern about bullies','Concern about traffic accident','No safe route to travel','Child lacks navigation skills','Child not physically fit','Child cannot recognize danger / seek help'],'1 = not at all concerned - 5 = extremely concerned')}</div>
      ` : `
      <div class="field"><div class="q-label">${t('What makes you decide not to escort')} ${childName(ch)}?</div>

    ${tempSaveBtn()}

/* Level-2 graphic upgrade: a small flat-style SVG "scene" per scenario card, replacing the plain
   emoji-in-a-box. Danger/crime/trust levels are drawn into the scene itself (hazard marks, a
   dark overlay for high crime risk, a trust badge) so the illustration reflects the actual
   attribute values for that option rather than being purely decorative. No external image
   files are used, so the mockup stays a single self-contained HTML file. */
function hazardMarks(level, color, yOffset){
  let out = '';
  const n = Math.max(0, Math.min(5, level|0));
  for(let i=0;i<n;i++){
    const x = 10 + i*15;
    const y = yOffset||8;
    out += `<polygon points="${x},${y} ${x+6},${y+11} ${x-6},${y+11}" fill="${color}" opacity="0.9"/><text x="${x}" y="${y+9}" font-size="7" fill="#fff" text-anchor="middle" font-weight="700">!</text>`;
  }
  return out;
}

}

      {title:'Third-party escort (songthaew)',icon:'VAN',time:20,fare:15,danger:2,crime:2,companion:'Third-party escort',trust:'Low'},
      {title:'Child travels alone by PT',icon:'BUS',time:30,fare:50,danger:2,crime:2,companion:'Escorted by guardian on arrival',wait:15,walkbike:7}
    ]},

function m1Rows(o){
  const unit = lang==='th' ? 'นาที' : 'min';
  const rows = [{icon:'TIME',label:'Travel time',ctrl:true,value:o.time+' '+unit}];
  if(o.wait!==undefined) rows.push({icon:'WAIT',label:'Wait time',value:o.wait+' '+unit});
  if(o.walkbike!==undefined) rows.push({icon:'WALK',label:'Walk/bike portion',value:o.walkbike+' '+unit});
  rows.push({icon:'FARE',label:'PT fare',ctrl:true,value:o.fare+' THB'});
  rows.push({icon:'TRAF',label:'Traffic & footpath danger',ctrl:true,bar:dangerBar(o.danger)});
  rows.push({icon:'CRIME',label:'Crime danger',ctrl:true,bar:dangerBar(o.crime)});
  rows.push({icon:'COMP',label:'Companion scheme',ctrl:true,value:t(o.companion)});
  if(o.trust) rows.push({icon:'TRUST',label:'Third-party trust',value:t(o.trust)});
  return rows;
}

/* Module 2 - School Choice. School A = respondent's real current school (fixed, reused from
   RP Sections 4/5 where available); School B = hypothetical alternative that varies per round.
   7 attributes: 4 core (time, tuition, reputation, school type) + 3 exploratory (class size,
   required mode, route/area safety). */
function schoolARef(){
  const kid = spChildId ? characters.find(c=>c.id===spChildId) : null;
  return {
    type: (kid && A[kid.id+'_schooltype']) || 'Public',
    tuition: (kid && A['tuition_'+kid.id]) || A['tuition'] || 'Free/public',
    reputation: A['school_reputation_rating'] || '3',
    classSize: '30-40',
    mode: 'Same as usual',
    safety: 'As usual',
  };
}
function buildModule2(){
  const ref = schoolARef();
  const schoolA = {title:'School A (your current school)',icon:'A',fixed:true,time:'Same as usual',tuition:ref.tuition,reputation:ref.reputation,type:ref.type,classSize:ref.classSize,mode:ref.mode,safety:ref.safety};
  return [
    {round:1, options:[schoolA,
      {title:'School B (alternative)',icon:'B',time:15,tuition:'5,000-15,000',reputation:'4',type:'Private, local',classSize:'20-30',mode:'Walk',safety:'Safer route'}
    ]},
    {round:2, options:[schoolA,
      {title:'School B (alternative)',icon:'B',time:30,tuition:'Free/public',reputation:'2',type:'Public',classSize:'40-50',mode:'School bus',safety:'Some risk'}
    ]},
    {round:3, options:[schoolA,
      {title:'School B (alternative)',icon:'B',time:10,tuition:'15,000-30,000',reputation:'5',type:'Private, international',classSize:'15-20',mode:'Escort by car',safety:'Safer route'}
    ]},
    {round:4, options:[schoolA,
      {title:'School B (alternative)',icon:'B',time:25,tuition:'<5,000',reputation:'3',type:'Public',classSize:'30-40',mode:'Bus',safety:'As usual'}
    ]},
  ];
}
function m2Rows(o){
  return [
    {icon:'TIME',label:'Travel time',ctrl:true,value:t(String(o.time))},
    {icon:'FEE',label:'Tuition',ctrl:true,value:t(o.tuition)},
    {icon:'REP',label:'Academic reputation',ctrl:true,value:o.reputation+'/5'},
    {icon:'TYPE',label:'School type',ctrl:true,value:t(o.type)},
    {icon:'SIZE',label:'Class size',value:o.classSize},
    {icon:'MODE',label:'Required travel mode',value:t(o.mode)},
    {icon:'SAFE',label:'Route/area safety',value:t(o.safety)},
  ];
}

function scenarioCard(title,cardIcon,rows,selKey,idx,note,opt){
  const selected = A[selKey]===idx;
  const scene = sceneFor(cardIcon, opt);
  return `<div class="opt-card ${selected?'selected':''}" onclick="A['${selKey}']=${idx};renderSP()">
    <span class="pick-badge">${t('Your choice')}</span>
    ${scene || `<div class="icon">${iconGlyph(cardIcon)}</div>`}
    <div class="opt-title">${t(title)}</div>
    ${note?`<div class="q-help" style="margin-bottom:8px">${note}</div>`:''}
    ${rows.map(r=>`<div class="attr-row"><span class="ic">${iconGlyph(r.icon)}</span> ${t(r.label)} ${r.bar?r.bar:`<b>${r.value}</b>`}</div>`).join('')}
  </div>`;
}

/* setup + module state machine: spPhase walks setup -> m1 -> m1-transition -> m2 -> debrief -> summary */
let spPhase = 'setup';
let spRoundIdx = 0;
window.setSpChild = (id)=>{ spChildId = id; renderSP(); };
window.setSpMode = (m)=>{ spMode = m; renderSP(); };
window.setSpTripType = (tt)=>{ spTripType = tt; renderSP(); };
window.startModule1 = ()=>{ spSetupDone = true; spPhase = 'm1'; spRoundIdx = 0; renderSP(); };

function renderSPSetup(){
  const kids = characters.filter(c=>c.kind==='child');
  return `
    <div class="hero" style="padding:20px"><h1 style="font-size:22px">${t('Before we begin: a few quick setup questions')}</h1></div>
    ${kids.length>1?`<div class="field"><div class="q-label">${t('Which child is this stated-preference exercise about?')}</div>
      <div class="opt-row">${kids.map(c=>{
        const on = spChildId===c.id?'checked':'';
        return `<label class="opt ${on}" onclick="setSpChild('${c.id}')">${childName(c)}</label>`;
      }).join('')}</div></div>`:''}
    <div class="field"><div class="q-label">${t('For escorting trips, do you mainly use a car or a motorcycle?')}</div>
      <div class="opt-row">${['Car','Motorbike'].map(m=>{
        const on = spMode===m?'checked':'';
        return `<label class="opt ${on}" onclick="setSpMode('${m}')">${t(m)}</label>`;
      }).join('')}</div></div>
    <div class="field"><div class="q-label">${t('Is this usually a dedicated trip just for escorting, or chained with another errand (e.g. on the way to work)?')}</div>
      <div class="opt-row">${['Dedicated trip','Chained with another errand'].map(o=>{
        const on = spTripType===o?'checked':'';
        return `<label class="opt ${on}" onclick="setSpTripType('${o}')">${t(o)}</label>`;
      }).join('')}</div></div>
    <div class="q-note" style="display:block">${t('Based on your earlier answers, travel modes you said are not available to you (e.g. no motorcycle license, no school bus service) are excluded from the choices below.')}</div>
    <div class="nav-row"><span></span><button class="btn btn-primary" ${(!spMode||!spTripType)?'disabled':''} onclick="startModule1()">${t('Start Module 1 ->')}</button></div>
  `;
}

function renderModuleRound(moduleName,rounds,rowsFn,question,onDone){
  const dots = rounds.map((s,i)=>`<div class="dot ${i<spRoundIdx?'done':i===spRoundIdx?'active':''}"></div>`).join('');
  const sc = rounds[spRoundIdx];
  const selKey = moduleName+'_'+spRoundIdx;
  return `
    <div class="sp-progress">${dots}</div>
    <div class="sp-round-label">${t('Round')} ${sc.round} ${t('of')} ${rounds.length}</div>
    <div class="sp-question">${t(question)}</div>
    <div class="option-row">${sc.options.map((o,oi)=>scenarioCard(o.title,o.icon,rowsFn(o),selKey,oi,o.fixed?t('(reference only - based on your earlier answers)'):null,o)).join('')}</div>
    <div class="sp-footer">${t('Tap a card to choose. You can change your answer before moving on.')}</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="${spRoundIdx===0?('spPhase=\''+(moduleName==='m1'?'setup':'m1-transition')+'\';'):'spRoundIdx--;'}renderSP()">${t('<- Back')}</button>
      <button class="btn btn-primary" onclick="${spRoundIdx<rounds.length-1?'spRoundIdx++;renderSP()':onDone}" ${A[selKey]===undefined?'disabled':''}>${spRoundIdx<rounds.length-1?t('Next round ->'):t('Continue ->')}</button>
    </div>`;
}

function renderSP(){
  let body='';
  const m1rounds = buildModule1(spMode||'Car');
  const m2rounds = buildModule2();

  if(spPhase==='setup'){
    body = renderSPSetup();
  } else if(spPhase==='m1'){
    body = renderModuleRound('m1', m1rounds, m1Rows, "For your child's usual school trip today, which would you choose?", `spPhase='m1-transition';spRoundIdx=0;renderSP()`);
    body = `<div class="sp-round-label" style="margin-bottom:10px">${t('Module 1 of 2: Escort / Travel Choice')}</div>` + body;
  } else if(spPhase==='m1-transition'){
    body = `
      <div class="hero"><h1>${t("Nicely done with Module 1! Now let's look at school choice.")}</h1></div>
      <div class="nav-row"><button class="btn btn-ghost" onclick="spPhase='m1';spRoundIdx=${m1rounds.length-1};renderSP()">${t('<- Back')}</button>
      <button class="btn btn-primary" onclick="spPhase='m2';spRoundIdx=0;renderSP()">${t('Continue to Module 2 ->')}</button></div>`;
  } else if(spPhase==='m2'){
    body = renderModuleRound('m2', m2rounds, m2Rows, 'For this school choice, which would you choose for your child?', `spPhase='debrief';renderSP()`);
    body = `<div class="sp-round-label" style="margin-bottom:10px">${t('Module 2 of 2: School Choice')}</div>` + body;
  } else if(spPhase==='debrief'){
    const factors1 = ['Travel time','PT fare','Traffic & footpath danger','Crime danger','Companion scheme','Having a companion','Trust in the driver','Something else'];
    const factors2 = ['Academic reputation/quality','Tuition cost','Distance/travel time','Class size','Route/area safety','Required travel mode','Something else'];
    body = `
      <div class="sp-round-label">Debrief</div>
      <div class="sp-question">${t('Thinking about the choices you just made, which factor mattered to you the most?')}</div>
      <div class="debrief-list">${factors1.map(f=>{
        const on = A['debrief1']===f;
        return `<label class="opt ${on?'checked':''}" onclick="A['debrief1']='${f}';renderSP()">${t(f)}</label>`;
      }).join('')}</div>
      <div class="sp-question" style="margin-top:26px">${t('Thinking about your school choice above, which factor mattered to you the most?')}</div>
      <div class="debrief-list">${factors2.map(f=>{
        const on = A['debrief2']===f;
        return `<label class="opt ${on?'checked':''}" onclick="A['debrief2']='${f}';renderSP()">${t(f)}</label>`;
      }).join('')}</div>
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="spPhase='m2';spRoundIdx=${m2rounds.length-1};renderSP()">${t('<- Back')}</button>
        <button class="btn btn-primary" onclick="spPhase='summary';renderSP()" ${(!A['debrief1']||!A['debrief2'])?'disabled':''}>${t('See summary ->')}</button>
      </div>`;
  } else {
    const chosen1 = m1rounds.map((sc,i)=>{ const o = sc.options[A['m1_'+i]]; return o ? t(o.title) : '-'; });
    const chosen2 = m2rounds.map((sc,i)=>{ const o = sc.options[A['m2_'+i]]; return o ? t(o.title) : '-'; });
    body = `
      <div class="hero"><h1>${t('Complete!')}</h1></div>
      <div class="summary-box">
        <b>${t('Module 1 choices (Escort / Travel)')}</b><br>
        ${chosen1.map((c,i)=>`<div style="margin:4px 0"><b>${t('Round')} ${i+1}:</b> ${c}</div>`).join('')}
        <div style="margin-top:8px"><b>${t('Most important factor:')}</b> ${t(A['debrief1'])}</div>
      </div>
      <div class="summary-box">
        <b>${t('Module 2 choices (School Choice)')}</b><br>
        ${chosen2.map((c,i)=>`<div style="margin:4px 0"><b>${t('Round')} ${i+1}:</b> ${c}</div>`).join('')}
        <div style="margin-top:8px"><b>${t('Most important factor:')}</b> ${t(A['debrief2'])}</div>
      </div>
      <div class="nav-row"><span></span><button class="btn btn-primary" onclick="spSetupDone=false;spPhase='setup';spRoundIdx=0;renderSP()">${t('Restart demo')}</button></div>`;
  }
  document.getElementById('sp-card').innerHTML = body;
}
renderSP();
</script>
